# This workflow is specific to sies2csv. Do not use it as a template for other projects.
name: Build and Release Java Application

on:
  push:
    tags:
      - 'v*' # Triggers when a new tag starting with 'v' is created, e.g., v1.0.0

permissions:
  contents: write # Required to create releases

jobs:
  build_and_release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven' # Caches dependencies for faster builds

      - name: Build with Maven
        run: mvn clean package

      - name: Create Release and Upload JAR
        uses: softprops/action-gh-release@v2
        with:
          # This is the dependency-inclusive JAR for sies2csv. Update this path when copying this workflow.
          files: target/sies2csv.jar
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref }}
          body: |
            Please refer to [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md) for details on this release.
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
